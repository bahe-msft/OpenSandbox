syntax = "proto3";

package opensandbox.egress.credentialprovider.v1;

option go_package = "github.com/alibaba/opensandbox/egress/pkg/credentialprovider/v1;credentialproviderv1";

import "google/protobuf/timestamp.proto";

// CredentialRequest is written as one protobuf message to provider stdin.
message CredentialRequest {
  string api_version = 1;
  string plugin_name = 2;
}

// CredentialResponse is read as one protobuf message from provider stdout.
message CredentialResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    SUCCESS = 1;
    UNAVAILABLE = 2;
    DENIED = 3;
  }

  enum Encoding {
    ENCODING_UNSPECIFIED = 0;
    UTF8 = 1;
    BASE64 = 2;
    BASE64URL = 3;
  }

  string api_version = 1;
  Status status = 2;
  bytes credential = 3;
  Encoding encoding = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool cacheable = 6;
  string error_code = 7;
}
